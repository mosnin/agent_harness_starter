# Hades desktop app — native installer build.
#
# This workflow produces the REAL platform installers (.dmg / .app, .deb /
# .AppImage, .msi / .nsis — the `bundle.targets` in src-tauri/tauri.conf.json)
# by running `cargo tauri build --features gui` on GitHub-hosted runners that
# actually have a display context + the platform webview libraries. That step
# CANNOT run in this repo's headless CI sandbox (see docs/INSTALL.md and
# docs/DESKTOP_APP.md), which is exactly why it lives in its own workflow here
# and is gated to explicit triggers rather than every push.
#
# NOTE: `--features gui` maps to the `gui` Cargo feature on `src-tauri`
# (real `tauri` dependency + window/webview bootstrap), which IS present in
# src-tauri/Cargo.toml. The default feature set stays empty, so the plain
# `cargo test` run by the main CI workflow remains std-only and offline.
name: Desktop Build

# Gated so it never runs on ordinary pushes/PRs: only a manual dispatch or a
# version tag (v1.2.3) kicks off the (heavy, multi-OS) installer build.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

# A newer tag/dispatch supersedes an in-flight run for the same ref.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix if one OS fails — a macOS signing hiccup
      # shouldn't throw away a good Linux/Windows build.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build so re-runs don't recompile the whole crate graph.
      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Linux needs the WebKitGTK + GTK + AppIndicator + rsvg dev libraries for
      # the webview and for building .deb / .AppImage bundles. macOS (WKWebView)
      # and Windows (WebView2, preinstalled on the runner image) need nothing
      # extra here.
      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install Node dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      # Bundle the two JS halves (Node sidecar + webview UI). This is the same
      # work `node scripts/package-desktop.mjs` does before the native step, and
      # it's the part that already runs headless.
      - name: Bundle sidecar + webview
        run: npm run desktop:build

      # The native installer build. Reads src-tauri/tauri.conf.json, opens a
      # webview, and emits the platform bundles. `--features gui` selects the
      # real Tauri app build (see the note at the top of this file).
      - name: Build native installers
        working-directory: src-tauri
        run: cargo tauri build --features gui

      # Collect whatever installer artifacts this OS produced. The globs cover
      # every target declared in tauri.conf.json; missing ones are ignored so a
      # single job can run on any of the three OSes.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hades-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
