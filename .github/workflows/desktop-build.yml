name: Desktop Build
on:
  workflow_dispatch: {}
  push:
    branches: [claude/hermes-swarm-framework-vbhrot]
    paths:
      - 'src/desktop/**'
      - 'src-tauri/**'
      - 'src/hades/**'
      - 'script/build_and_run.sh'
      - 'scripts/*desktop*'
      - 'scripts/macos-*'
      - 'package*.json'
      - '.github/workflows/desktop-build.yml'
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mac:
    name: Build Mac application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: mac-desktop-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npx vitest run src/desktop/__tests__/workbench-service.test.ts src/desktop/__tests__/desktop-additions.test.ts src/desktop/__tests__/mcp-stdio.test.ts src/hades/__tests__/model-stream.test.ts
      - run: ./script/build_and_run.sh --build-only
      - run: node scripts/smoke-macos.mjs
      - run: node scripts/smoke-macos.mjs --signal
      - name: Archive local-use application
        run: ditto -c -k --sequesterRsrc --keepParent dist-mac/Hades.app "dist-mac/Hades-mac-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Hades-mac-${{ runner.arch }}
          path: dist-mac/Hades-mac-*.zip
          if-no-files-found: error
          retention-days: 14
