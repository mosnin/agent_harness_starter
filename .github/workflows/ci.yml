name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit
        env:
          # Provide dummy values so type-check doesn't fail on optional imports
          OPENAI_API_KEY: sk-dummy
          DB_PROVIDER: memory
          AUTH_PROVIDER: none

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true  # remove once lint is fully clean

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build Next.js app
        run: npm run build
        env:
          OPENAI_API_KEY: sk-dummy
          DB_PROVIDER: memory
          AUTH_PROVIDER: none
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Run tests
        run: npm test --if-present
        env:
          OPENAI_API_KEY: sk-dummy

  # ---------------------------------------------------------------------------
  # Bundle smoke — run the SHIPPED BINARY, not the source.
  #
  # Every defect the product audit found survived a green unit-test suite,
  # because nothing in CI ever executed dist-hades/hades.js or `npm run
  # build:lib`. The CJS bundle crashed on `gov airgap` while the tsx path was
  # fine; build:lib had been broken for 250+ commits; `hades chat` was a stub;
  # and the verification gate certified four wrong answers on the first live
  # run. This job exercises exactly those paths, with no API key and no
  # external network (the live lanes talk to scripts/stub-llm.mjs on
  # loopback).
  # ---------------------------------------------------------------------------
  bundle-smoke:
    name: Bundle Smoke (shipped binary)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Smoke the shipped CLI, the library build, and the trust gate
        run: bash scripts/smoke-bundle.sh

  # The Rust half of the desktop shell. `cargo test` with no --features pulls
  # no external crates (see src-tauri/Cargo.toml), so the supervisor logic is
  # verifiable in headless CI even though the real installer build is not.
  rust:
    name: Desktop supervisor (cargo test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test
