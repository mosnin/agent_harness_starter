name: Agent CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser for real local browser tests
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run type-check
      - run: npm test -- --maxWorkers=4
      - run: npm run build:hades
      - run: npm run build:swarm
      - run: npm run desktop:build
      - name: Exercise packaged CLI with a local HTTP fixture
        run: npm run test:smoke
